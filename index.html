<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MELY & EMA ❤️</title>

<style>
body {
  margin: 0;
  padding: 0;
  background: #f5f0e6;
  font-family: "Georgia", serif;
  color: #2c2c2c;
  line-height: 1.7;
}
/* APARICIÓN SUAVE */
.seccion {
  opacity: 0;
  transition: opacity 2s ease;
}

.visible {
  opacity: 1;
}
/* CONTENEDOR */
.container {
  max-width: 800px;
  margin: auto;
  padding: 40px 20px;
}

/* TÍTULO */
h1 {
  text-align: center;
  font-size: 34px;
  margin-bottom: 5px;
}

.date {
  text-align: center;
  margin-bottom: 40px;
  font-size: 16px;
  color: #555;
}

/* PORTADA */
.portada {
  text-align: center;
  margin-bottom: 40px;
}

.portada img {
  width: 220px;
  border-radius: 10px;
}

/* CARTA */
.carta {
  font-size: 18px;
  white-space: pre-line;
  margin-bottom: 40px;
  min-height: 100px;
}

/* CURSOR */
.cursor {
  display: inline-block;
  width: 2px;
  background: #2c2c2c;
  animation: blink 0.8s infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}

/* CONTADOR */
.contador {
  text-align: center;
  font-size: 18px;
  margin: 40px 0;
}

/* SEPARADOR */
hr {
  border: none;
  border-top: 1px solid #ccc;
  margin: 50px 0;
}

/* CARRUSEL CORREGIDO */
.carousel {
  width: 100%;
  max-width: 500px;
  margin: 30px auto;
  overflow: hidden;
  border-radius: 10px;
}

.track {
  display: flex;
  transition: transform 0.6s ease;
}

.track img {
  width: 100%;
  max-width: 500px;
  height: 320px;
  object-fit: cover;
  flex-shrink: 0;
}

/* VIDEO */
video {
  width: 100%;
  max-width: 500px;
  display: block;
  margin: 40px auto;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">

<h1 id="titulo" class="seccion">MELY & EMA ❤️</h1>

<div id="fecha" class="date seccion">
  13 de mayo de 2023
</div>

<!-- PORTADA -->
<div id="portada" class="portada seccion">
 <img src="portada.jpg">
</div>

<hr>

<!-- CARTA INICIAL -->
<div class="carta seccion" id="carta1"></div>

<hr>

<!-- CONTADOR -->
<div id="contadorBloque" class="seccion">
  <div class="contador" id="contador"></div>
</div>
<hr>

<h2 id="recuerdosTitulo" class="seccion" style="text-align:center;">
  NUESTROS RECUERDOS
</h2>

<!-- CARRUSEL -->
  <div id="carruselBloque" class="carousel seccion">
  <div class="track" id="track">

    <img src="foto1.jpg">
    <img src="foto2.jpg">
    <img src="foto3.jpg">
    <img src="foto4.jpg">
    <img src="foto5.jpg">
    <img src="foto6.jpg">
    <img src="foto7.jpg">
    <img src="foto8.jpg">
    <img src="foto9.jpg">
    <img src="foto10.jpg">
    <img src="foto11.jpg">
    <img src="foto12.jpg">
    <img src="foto13.jpg">
    <img src="foto14.jpg">
    <img src="foto15.jpg">

  </div>
</div>

<hr>

<div id="videoBloque" class="seccion">

<h2 style="text-align:center;">▶️ VIDEO</h2>

<video controls>

</div>

<source src="video.mp4" type="video/mp4">
</video>

<hr>

<!-- CARTA FINAL -->
  
<div class="carta seccion" id="carta2"></div>
<div id="firma"
     class="seccion"
     style="display:none; text-align:center; margin-top:20px;">
  <img src="firma.png" alt="Firma" style="max-width:220px;">
</div>

</div>

<script>

/* TEXTO INICIAL */
const texto1 = `A veces la vida une caminos de la forma más inesperada.
Y cuando eso ocurre, algunos encuentros dejan de ser coincidencias para convertirse en hogar.

Hay personas que llegan a nuestra vida haciendo ruido y otras que llegan convirtiéndose en calma. Tú fuiste eso para mí.

No recuerdo cada palabra que hemos dicho ni cada momento que hemos compartido, pero sí recuerdo la sensación de encontrar en ti un lugar seguro.`;

let i = 0;
function escribir1() {
  if (i < texto1.length) {
    document.getElementById("carta1").innerHTML += texto1.charAt(i);
    i++;
    setTimeout(escribir1, 25);
  }
}
escribir1();

/* CONTADOR */
function actualizarContador() {
  const inicio = new Date("2023-05-13T22:10:00");
  const ahora = new Date();
  const diff = ahora - inicio;

  const segundos = Math.floor(diff / 1000);
  const minutos = Math.floor(segundos / 60);
  const horas = Math.floor(minutos / 60);
  const dias = Math.floor(horas / 24);

  document.getElementById("contador").innerHTML =
    `${dias} días • ${horas % 24} horas • ${minutos % 60} minutos • ${segundos % 60} segundos`;
}
setInterval(actualizarContador, 1000);
actualizarContador();

/* CARRUSEL */

let index = 0;

setInterval(() => {

  const track = document.getElementById("track");
  const total = track.children.length;

  index++;

  if (index >= total) {
    index = 0;
  }

  track.style.transform =
    `translateX(${-index * 500}px)`;

}, 3000);


/* CARTA FINAL */

const texto2 = `Gracias por cada conversación, cada risa y cada momento compartido.

Gracias por la paciencia que tanto admiro y por la tranquilidad que aportas a mi vida.

No sé cuántos capítulos nos quedan por escribir, pero sé que mi parte favorita de esta historia es que la estamos escribiendo juntos.

Con amor,`;

let j = 0;
let cartaFinalIniciada = false;

function escribir2() {

  if (j < texto2.length) {

    document.getElementById("carta2").innerHTML += texto2.charAt(j);

    j++;

    setTimeout(escribir2, 25);

  } else {

    document.getElementById("firma").style.display = "block";

  }

}

function revisarCartaFinal() {

  const carta = document.getElementById("carta2");

  const posicion = carta.getBoundingClientRect().top;

  if (
    posicion < window.innerHeight &&
    !cartaFinalIniciada
  ) {

    cartaFinalIniciada = true;

    escribir2();

  }

}

window.addEventListener("scroll", revisarCartaFinal);
window.addEventListener("load", revisarCartaFinal);

</script>

</body>
</html>
